<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>快乐学习卡片</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap">
<style>
/* ===== 全局重置与变量 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg-grad-1: #E8F4FD;
  --bg-grad-2: #FFF8E7;
  --card-bg: #FFFFFF;
  --shadow: 0 8px 32px rgba(0,0,0,0.08);
  --radius: 28px;
  --hanzi-color: #FF8C42;
  --hanzi-light: #FFE8D6;
  --poem-color: #52B788;
  --poem-light: #D8F3DC;
  --eng-color: #4D96FF;
  --eng-light: #DBEAFE;
  --text-dark: #2D3436;
  --text-mid: #636E72;
  --text-light: #B2BEC3;
}
html, body {
  height: 100%;
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--text-dark);
  background: linear-gradient(160deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
  overflow: hidden;
  user-select: none;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ===== 装饰背景元素（SVG） ===== */
.bg-decor {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}
.bg-decor.cloud-1 { top: 6%; left: -3%; animation: float 6s ease-in-out infinite; }
.bg-decor.cloud-2 { top: 12%; right: -2%; animation: float 8s ease-in-out infinite 1s; }
.bg-decor.star-1 { top: 38%; left: 4%; animation: twinkle 3s ease-in-out infinite; }
.bg-decor.star-2 { top: 58%; right: 6%; animation: twinkle 4s ease-in-out infinite 0.5s; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
@keyframes twinkle { 0%,100% { opacity: 0.25; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.2); } }

/* ===== 顶部标题区 ===== */
.header {
  position: relative;
  z-index: 10;
  padding: 18px 20px 0;
  text-align: center;
  flex-shrink: 0;
}
.header h1 {
  font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', cursive;
  font-size: 26px;
  color: var(--text-dark);
  margin-bottom: 14px;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.header h1 .title-icon { width: 28px; height: 28px; flex-shrink: 0; }

/* ===== 分类 Tab ===== */
.tabs {
  display: flex;
  gap: 8px;
  justify-content: center;
  padding: 0 16px;
  margin-bottom: 14px;
}
.tab-btn {
  flex: 1;
  max-width: 110px;
  padding: 10px 14px;
  border: none;
  border-radius: 20px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  background: rgba(255,255,255,0.75);
  color: var(--text-mid);
  backdrop-filter: blur(10px);
}
.tab-btn.active.hanzi {
  background: var(--hanzi-color); color: #fff; transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(255,140,66,0.4);
}
.tab-btn.active.poem {
  background: var(--poem-color); color: #fff; transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(82,183,136,0.4);
}
.tab-btn.active.eng {
  background: var(--eng-color); color: #fff; transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(77,150,255,0.4);
}

/* ===== 卡片容器 ===== */
.card-area {
  flex: 1;
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 20px;
  overflow: hidden;
}
.card-track {
  position: relative;
  width: 100%;
  max-width: 400px;
  height: 100%;
  display: flex;
  align-items: center;
  perspective: 1000px;
}
.card {
  position: absolute;
  width: 100%;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 26px 22px;
  display: flex;
  flex-direction: column;
  min-height: 380px;
  max-height: calc(100vh - 260px);
  overflow-y: auto;
  backface-visibility: hidden;
}
.card::-webkit-scrollbar { width: 0; }

/* 滑动动画 */
.card.slide-out-left {
  animation: slideOutLeft 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
.card.slide-out-right {
  animation: slideOutRight 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
.card.slide-in-right {
  animation: slideInRight 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.card.slide-in-left {
  animation: slideInLeft 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes slideOutLeft {
  to { transform: translateX(-120%) rotate(-5deg) scale(0.9); opacity: 0; }
}
@keyframes slideOutRight {
  to { transform: translateX(120%) rotate(5deg) scale(0.9); opacity: 0; }
}
@keyframes slideInRight {
  from { transform: translateX(120%) rotate(5deg) scale(0.9); opacity: 0; }
  to { transform: translateX(0) rotate(0) scale(1); opacity: 1; }
}
@keyframes slideInLeft {
  from { transform: translateX(-120%) rotate(-5deg) scale(0.9); opacity: 0; }
  to { transform: translateX(0) rotate(0) scale(1); opacity: 1; }
}

/* 卡片顶部装饰条 */
.card-top-bar {
  width: 48px; height: 5px; border-radius: 3px; margin: 0 auto 16px;
}
.card.hanzi-card .card-top-bar { background: var(--hanzi-color); }
.card.poem-card .card-top-bar { background: var(--poem-color); }
.card.eng-card .card-top-bar { background: var(--eng-color); }

/* ===== 汉字卡片 ===== */
.hanzi-pinyin {
  text-align: center; font-size: 22px; color: var(--hanzi-color);
  font-weight: 700; margin-bottom: 8px; letter-spacing: 3px;
}
.tian-zi-ge {
  position: relative; width: 170px; height: 170px; margin: 0 auto 14px;
  border: 3px solid var(--hanzi-color); border-radius: 8px;
  background:
    linear-gradient(to right, transparent 49.5%, rgba(255,140,66,0.2) 49.5%, rgba(255,140,66,0.2) 50.5%, transparent 50.5%),
    linear-gradient(to bottom, transparent 49.5%, rgba(255,140,66,0.2) 49.5%, rgba(255,140,66,0.2) 50.5%, transparent 50.5%),
    #FFFDF7;
}
.hanzi-char {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 115px; font-weight: 900; color: var(--text-dark); line-height: 1;
  font-family: 'Noto Sans SC', sans-serif;
}
.hanzi-char.writing {
  color: var(--hanzi-color);
  clip-path: inset(0 100% 0 0);
  animation: writeChar 1.8s ease-in-out forwards;
}
@keyframes writeChar {
  0% { clip-path: inset(0 100% 0 0); }
  25% { clip-path: inset(0 75% 0 0); }
  50% { clip-path: inset(0 50% 0 0); }
  75% { clip-path: inset(0 25% 0 0); }
  100% { clip-path: inset(0 0 0 0); }
}
.hanzi-meaning {
  text-align: center; font-size: 15px; color: var(--text-mid); margin-bottom: 12px; line-height: 1.5;
}
.hanzi-words {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px;
}
.word-tag {
  padding: 6px 14px; background: var(--hanzi-light); color: var(--hanzi-color);
  border-radius: 14px; font-size: 14px; font-weight: 600;
}
.stroke-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px; border: 2px dashed var(--hanzi-color);
  border-radius: 16px; background: var(--hanzi-light); color: var(--hanzi-color);
  font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.stroke-btn:active { transform: scale(0.97); background: #FFD4B8; }
.stroke-btn svg { width: 18px; height: 18px; }

/* ===== 古诗卡片 ===== */
.poem-title {
  text-align: center; font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 26px; color: var(--poem-color); margin-bottom: 4px;
}
.poem-author {
  text-align: center; font-size: 14px; color: var(--text-mid); margin-bottom: 16px;
}
.poem-divider {
  width: 60px; height: 2px; margin: 4px auto 14px;
  background: linear-gradient(to right, transparent, var(--poem-color), transparent);
}
.poem-lines {
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.poem-line { text-align: center; }
.poem-line-pinyin {
  font-size: 13px; color: var(--poem-color); margin-bottom: 2px; letter-spacing: 1px; font-weight: 500;
}
.poem-line-text {
  font-size: 21px; color: var(--text-dark); font-weight: 600; letter-spacing: 3px;
}

/* ===== 英语卡片 ===== */
.eng-word {
  text-align: center; font-size: 46px; font-weight: 900; color: var(--eng-color);
  margin-bottom: 6px; letter-spacing: 1px; word-break: break-all;
}
.eng-phonetic {
  text-align: center; font-size: 19px; color: var(--text-mid); margin-bottom: 14px; font-style: italic;
}
.play-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: fit-content; margin: 0 auto 18px; padding: 12px 28px;
  border: none; border-radius: 24px; background: var(--eng-color); color: #fff;
  font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
  transition: all 0.2s; box-shadow: 0 4px 14px rgba(77,150,255,0.35);
}
.play-btn:active { transform: scale(0.95); }
.play-btn.playing { animation: pulse 0.8s ease-in-out infinite; }
.play-btn svg { width: 18px; height: 18px; }
@keyframes pulse {
  0%,100% { box-shadow: 0 4px 14px rgba(77,150,255,0.35); }
  50% { box-shadow: 0 4px 24px rgba(77,150,255,0.6); }
}
.eng-meaning {
  text-align: center; font-size: 22px; color: var(--text-dark); font-weight: 600; margin-bottom: 10px;
}
.eng-example {
  text-align: center; font-size: 14px; color: var(--text-mid);
  padding: 10px 16px; background: var(--eng-light); border-radius: 14px; line-height: 1.6;
}
.eng-example .cn { display: block; margin-top: 4px; color: var(--text-light); font-size: 13px; }

/* ===== 底部控制区 ===== */
.controls {
  position: relative; z-index: 10; padding: 10px 20px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 12px; flex-shrink: 0;
}
.nav-buttons { display: flex; gap: 20px; align-items: center; }
.nav-btn {
  width: 50px; height: 50px; border: none; border-radius: 50%; background: #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,0.1); cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s; color: var(--text-dark);
}
.nav-btn:active { transform: scale(0.9); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-btn svg { width: 20px; height: 20px; }
.progress-text {
  min-width: 50px; text-align: center; font-size: 15px; font-weight: 700; color: var(--text-mid);
}
.progress-bar {
  width: 100%; max-width: 280px; height: 8px; border-radius: 4px;
  background: rgba(0,0,0,0.08); overflow: hidden; cursor: pointer;
}
.progress-fill {
  height: 100%; border-radius: 4px; transition: width 0.3s ease;
  width: 0%;
}
.progress-fill.hanzi-fill { background: var(--hanzi-color); }
.progress-fill.poem-fill { background: var(--poem-color); }
.progress-fill.eng-fill { background: var(--eng-color); }

/* ===== 响应式 ===== */
@media (max-height: 680px) {
  .header h1 { font-size: 22px; margin-bottom: 10px; }
  .tabs { margin-bottom: 8px; }
  .tab-btn { padding: 8px 12px; font-size: 14px; }
  .card { padding: 18px; min-height: 300px; }
  .tian-zi-ge { width: 130px; height: 130px; }
  .hanzi-char { font-size: 88px; }
  .eng-word { font-size: 36px; }
  .poem-line-text { font-size: 17px; }
  .controls { padding: 6px 20px 16px; gap: 8px; }
}
@media (max-width: 360px) {
  .card { padding: 20px 16px; }
  .tian-zi-ge { width: 145px; height: 145px; }
  .hanzi-char { font-size: 98px; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">

<!-- 背景装饰 -->
<div class="bg-decor cloud-1"><svg width="70" height="44"><use href="#icon-cloud"/></svg></div>
<div class="bg-decor cloud-2"><svg width="56" height="36"><use href="#icon-cloud"/></svg></div>
<div class="bg-decor star-1"><svg width="28" height="28"><use href="#icon-star"/></svg></div>
<div class="bg-decor star-2"><svg width="24" height="24"><use href="#icon-star"/></svg></div>

<!-- 顶部 -->
<header class="header">
  <h1>
    <svg class="title-icon"><use href="#icon-book"/></svg>
    快乐学习卡片
    <svg class="title-icon"><use href="#icon-book"/></svg>
  </h1>
  <nav class="tabs">
    <button class="tab-btn active hanzi" data-tab="hanzi">汉字</button>
    <button class="tab-btn poem" data-tab="poem">古诗</button>
    <button class="tab-btn eng" data-tab="eng">英语</button>
  </nav>
</header>

<!-- 卡片区 -->
<main class="card-area">
  <div class="card-track" id="cardTrack"></div>
</main>

<!-- 底部控制 -->
<footer class="controls">
  <div class="nav-buttons">
    <button class="nav-btn" id="prevBtn" aria-label="上一张"><svg><use href="#icon-chevron-left"/></svg></button>
    <span class="progress-text" id="progressText">1 / 1</span>
    <button class="nav-btn" id="nextBtn" aria-label="下一张"><svg><use href="#icon-chevron-right"/></svg></button>
  </div>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
</footer>

// ===== 状态管理 =====
const state = {
  currentTab: 'hanzi',
  currentIndex: 0,
  isAnimating: false,
  data: { hanzi: hanziData, poem: poemData, eng: englishData }
};

// ===== DOM 引用 =====
const cardTrack = document.getElementById('cardTrack');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressText = document.getElementById('progressText');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const tabBtns = document.querySelectorAll('.tab-btn');

// ===== 卡片HTML生成 =====
function createHanziCard(item) {
  return `
    <div class="card hanzi-card">
      <div class="card-top-bar"></div>
      <div class="hanzi-pinyin">${item.pinyin}</div>
      <div class="tian-zi-ge">
        <div class="hanzi-char" id="hanziChar">${item.char}</div>
      </div>
      <div class="hanzi-meaning">${item.meaning}</div>
      <div class="hanzi-words">
        ${item.words.map(w => `<span class="word-tag">${w}</span>`).join('')}
      </div>
      <button class="stroke-btn" onclick="playStroke(this)">
        <svg><use href="#icon-pencil"/></svg> 看笔顺
      </button>
    </div>
  `;
}

function createPoemCard(item) {
  return `
    <div class="card poem-card">
      <div class="card-top-bar"></div>
      <div class="poem-title">${item.title}</div>
      <div class="poem-author">—— ${item.author}</div>
      <div class="poem-divider"></div>
      <div class="poem-lines">
        ${item.lines.map(line => `
          <div class="poem-line">
            <div class="poem-line-pinyin">${line.pinyin}</div>
            <div class="poem-line-text">${line.text}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function createEngCard(item) {
  return `
    <div class="card eng-card">
      <div class="card-top-bar"></div>
      <div class="eng-word">${item.word}</div>
      <div class="eng-phonetic">${item.phonetic}</div>
      <button class="play-btn" onclick="playWord(this, '${item.word}')">
        <svg><use href="#icon-speaker"/></svg> 听发音
      </button>
      <div class="eng-meaning">${item.meaning}</div>
      <div class="eng-example">
        ${item.example}
        <span class="cn">${item.exampleCn}</span>
      </div>
    </div>
  `;
}

function getCardHTML(item) {
  if (state.currentTab === 'hanzi') return createHanziCard(item);
  if (state.currentTab === 'poem') return createPoemCard(item);
  return createEngCard(item);
}

// ===== 渲染与切换 =====
function renderInitial() {
  const list = state.data[state.currentTab];
  cardTrack.innerHTML = getCardHTML(list[0]);
  updateControls();
}

function switchCard(newIndex, direction) {
  if (state.isAnimating) return;
  const list = state.data[state.currentTab];
  if (newIndex < 0 || newIndex >= list.length || newIndex === state.currentIndex) return;

  state.isAnimating = true;
  const oldCard = cardTrack.querySelector('.card');
  const outClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
  const inClass = direction === 'next' ? 'slide-in-right' : 'slide-in-left';

  // 旧卡片滑出
  if (oldCard) {
    oldCard.classList.add(outClass);
  }

  // 创建新卡片
  const newCardHTML = getCardHTML(list[newIndex]);
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = newCardHTML;
  const newCard = tempDiv.firstElementChild;
  newCard.classList.add(inClass);
  cardTrack.appendChild(newCard);

  state.currentIndex = newIndex;
  updateControls();

  // 动画结束后清理旧卡片
  setTimeout(() => {
    if (oldCard && oldCard.parentNode) oldCard.parentNode.removeChild(oldCard);
    newCard.classList.remove(inClass);
    state.isAnimating = false;
  }, 420);
}

function nextCard() {
  const list = state.data[state.currentTab];
  if (state.currentIndex < list.length - 1) switchCard(state.currentIndex + 1, 'next');
}

function prevCard() {
  if (state.currentIndex > 0) switchCard(state.currentIndex - 1, 'prev');
}

function goToCard(index) {
  if (index === state.currentIndex) return;
  switchCard(index, index > state.currentIndex ? 'next' : 'prev');
}

// ===== 控制更新 =====
function updateControls() {
  const list = state.data[state.currentTab];
  progressText.textContent = `${state.currentIndex + 1} / ${list.length}`;
  prevBtn.disabled = state.currentIndex === 0;
  nextBtn.disabled = state.currentIndex === list.length - 1;

  const percent = list.length > 1 ? (state.currentIndex / (list.length - 1)) * 100 : 0;
  progressFill.style.width = percent + '%';
  progressFill.className = 'progress-fill ' + state.currentTab + '-fill';
}

// ===== 切换分类 =====
function switchTab(tab) {
  if (state.currentTab === tab || state.isAnimating) return;
  state.currentTab = tab;
  state.currentIndex = 0;

  tabBtns.forEach(btn => {
    btn.classList.remove('active', 'hanzi', 'poem', 'eng');
    if (btn.dataset.tab === tab) btn.classList.add('active', tab);
  });

  // 直接替换（分类切换不做滑动动画）
  cardTrack.innerHTML = getCardHTML(state.data[tab][0]);
  updateControls();
}

// ===== 笔顺动画 =====
function playStroke(btn) {
  const charEl = document.getElementById('hanziChar');
  if (!charEl) return;
  charEl.classList.remove('writing');
  void charEl.offsetWidth;
  charEl.classList.add('writing');
  btn.innerHTML = '<svg><use href="#icon-pencil"/></svg> 书写中...';
  setTimeout(() => {
    btn.innerHTML = '<svg><use href="#icon-pencil"/></svg> 再写一次';
  }, 1900);
}

// ===== 英语发音 =====
function playWord(btn, word) {
  if (!('speechSynthesis' in window)) {
    btn.innerHTML = '<svg><use href="#icon-speaker"/></svg> 设备不支持';
    setTimeout(() => { btn.innerHTML = '<svg><use href="#icon-speaker"/></svg> 听发音'; }, 2000);
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = 'en-US';
  utterance.rate = 0.8;
  utterance.pitch = 1.1;

  btn.classList.add('playing');
  btn.innerHTML = '<svg><use href="#icon-speaker"/></svg> 播放中...';

  utterance.onend = () => {
    btn.classList.remove('playing');
    btn.innerHTML = '<svg><use href="#icon-speaker"/></svg> 再听一次';
  };
  utterance.onerror = () => {
    btn.classList.remove('playing');
    btn.innerHTML = '<svg><use href="#icon-speaker"/></svg> 听发音';
  };
  window.speechSynthesis.speak(utterance);
}

// ===== 触摸滑动 =====
let touchStartX = 0;
const SWIPE_THRESHOLD = 50;

cardTrack.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

cardTrack.addEventListener('touchend', (e) => {
  const diff = touchStartX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > SWIPE_THRESHOLD) {
    if (diff > 0) nextCard(); else prevCard();
  }
}, { passive: true });

// 鼠标拖拽（桌面端）
let mouseStartX = 0;
let isDragging = false;
cardTrack.addEventListener('mousedown', (e) => {
  mouseStartX = e.screenX; isDragging = true;
});
cardTrack.addEventListener('mouseup', (e) => {
  if (!isDragging) return; isDragging = false;
  const diff = mouseStartX - e.screenX;
  if (Math.abs(diff) > SWIPE_THRESHOLD) {
    if (diff > 0) nextCard(); else prevCard();
  }
});

// ===== 键盘支持 =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prevCard();
  if (e.key === 'ArrowRight') nextCard();
});

// ===== 事件绑定 =====
prevBtn.addEventListener('click', prevCard);
nextBtn.addEventListener('click', nextCard);
tabBtns.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  const list = state.data[state.currentTab];
  const targetIndex = Math.round(percent * (list.length - 1));
  goToCard(Math.max(0, Math.min(list.length - 1, targetIndex)));
});

// ===== 初始化 =====
renderInitial();
</script>
