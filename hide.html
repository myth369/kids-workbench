<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>数字躲哪儿了 · 小猎人找数字</title>
<style>
:root{
  --cream:#FFF7EC;
  --ink:#4A3B32;
  --ink-soft:#9A8577;
  --orange:#FF8A3D;
  --pink:#FF6B9D;
  --teal:#2EC4B6;
  --blue:#4EA8DE;
  --purple:#A78BFA;
  --yellow:#FFD166;
  --green:#57CC99;
  --red:#FF6B6B;
  --card:#FFFFFF;
  --line:#F2E3D2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 50% -10%, #FFF3D9 0%, transparent 60%),
    linear-gradient(180deg,#FFF9F0 0%, #FFEFDC 100%);
  overflow-x:hidden;
  user-select:none;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}

/* ---------- 通用按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;border-radius:999px;font-size:20px;font-weight:800;
  background:var(--orange);color:#fff;
  box-shadow:0 6px 0 #D96A24, 0 10px 18px rgba(255,138,61,.28);
  transition:transform .12s, box-shadow .12s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #D96A24, 0 4px 10px rgba(255,138,61,.25);}
.btn.blue{background:var(--blue);box-shadow:0 6px 0 #3B8CBE,0 10px 18px rgba(78,168,222,.28);}
.btn.blue:active{box-shadow:0 2px 0 #3B8CBE,0 4px 10px rgba(78,168,222,.25);}
.btn.green{background:var(--green);box-shadow:0 6px 0 #41A87C,0 10px 18px rgba(87,204,153,.28);}
.btn.green:active{box-shadow:0 2px 0 #41A87C,0 4px 10px rgba(87,204,153,.25);}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line),0 8px 14px rgba(0,0,0,.06);}
.btn.ghost:active{box-shadow:0 2px 0 var(--line),0 4px 8px rgba(0,0,0,.05);}
.btn.sm{padding:9px 16px;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.12);}
.btn.sm:active{transform:translateY(3px);}

/* ---------- 屏幕 ---------- */
.screen{display:none;min-height:100%;padding:16px;}
.screen.active{display:block;animation:fade .35s ease;}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 首页 ---------- */
.home-wrap{max-width:760px;margin:0 auto;text-align:center;padding-top:10px;}
.title{
  font-size:clamp(34px,7vw,56px);font-weight:900;letter-spacing:2px;line-height:1.15;
  color:var(--orange);
  text-shadow:0 4px 0 #FFD9B8, 0 8px 16px rgba(255,138,61,.22);
  margin:6px 0 4px;
}
.title .n{
  display:inline-block;color:var(--teal);text-shadow:0 4px 0 #BFF0EB;
  animation:bob 2.4s ease-in-out infinite;
}
.title .n:nth-child(2){animation-delay:.15s;color:var(--purple);text-shadow:0 4px 0 #E2D9FF;}
.title .n:nth-child(3){animation-delay:.3s;color:var(--pink);text-shadow:0 4px 0 #FFD3E3;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.subtitle{color:var(--ink-soft);font-size:17px;margin:0 0 18px;}

.hero{width:min(420px,86vw);margin:0 auto 6px;}
.hero svg{width:100%;height:auto;display:block;}

.panel{
  background:var(--card);border-radius:26px;padding:18px 20px;
  box-shadow:0 10px 26px rgba(180,140,100,.14);margin:14px 0;
  border:3px solid #FFF1E2;
}
.panel h3{margin:0 0 12px;font-size:19px;color:var(--ink);}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.opt{
  flex:1 1 150px;min-width:130px;padding:12px 10px;border-radius:18px;
  background:#FFF6EA;border:3px solid #FFE3C7;font-weight:800;font-size:16px;
  transition:transform .12s, border-color .15s, background .15s;
}
.opt .big{display:block;font-size:22px;font-weight:900;margin-bottom:2px;}
.opt .small{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);}
.opt:hover{transform:translateY(-3px);}
.opt.on{background:#FFEFD8;border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,138,61,.16);}
.opt.on .big{color:var(--orange);}

.howto{text-align:left;font-size:15px;line-height:1.9;color:var(--ink-soft);}
.howto b{color:var(--ink);}

/* ---------- 顶栏 ---------- */
.topbar{
  max-width:900px;margin:0 auto 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;
  padding:8px 14px;font-weight:800;font-size:15px;box-shadow:0 4px 10px rgba(180,140,100,.14);
  border:2px solid var(--line);
}
.chip.mission{font-size:17px;padding:9px 18px;}
.chip .tgt{
  display:inline-block;min-width:34px;text-align:center;
  background:var(--yellow);border-radius:10px;padding:1px 8px;margin:0 4px;
  color:#7A4E00;font-size:20px;font-weight:900;
  box-shadow:0 3px 0 #E8B23F;
}
.spacer{flex:1;}
.iconbtn{
  width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:22px;box-shadow:0 4px 10px rgba(180,140,100,.16);border:2px solid var(--line);
  transition:transform .12s;
}
.iconbtn:hover{transform:translateY(-2px) scale(1.05);}
.iconbtn:active{transform:scale(.94);}
.iconbtn.off{opacity:.45;}

/* ---------- 房子 ---------- */
.house-wrap{position:relative;max-width:820px;margin:0 auto;}
.house{position:relative;}
.roof{width:100%;line-height:0;position:relative;z-index:3;}
.roof svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 8px rgba(180,90,60,.18));}
.house-body{
  position:relative;z-index:2;
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:9px;background:#FFF3E2;
  border:6px solid #FFE0BE;border-top:none;
  border-radius:0 0 18px 18px;
  box-shadow:0 12px 26px rgba(180,140,100,.18);
}
.room-card{
  position:relative;border-radius:14px;padding:8px 6px 6px;
  background:var(--rc,#fff);
  border:3px solid rgba(0,0,0,.05);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:transform .16s cubic-bezier(.34,1.4,.64,1), box-shadow .16s;
  cursor:pointer;overflow:hidden;min-height:118px;
}
.room-card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 10px 18px rgba(120,80,50,.18);}
.room-card:active{transform:scale(.97);}
.room-card .mini{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:100%;flex:1;align-items:end;}
.room-card .mini span{display:flex;align-items:flex-end;justify-content:center;}
.room-card .mini svg{width:100%;height:auto;max-height:40px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08));}
.room-card .rname{
  font-weight:900;font-size:15px;letter-spacing:1px;
  background:#fff;border-radius:999px;padding:2px 12px;box-shadow:0 2px 0 rgba(0,0,0,.05);
}
.room-card .badge{
  position:absolute;top:5px;right:5px;min-width:24px;height:24px;border-radius:999px;
  background:var(--green);color:#fff;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 7px;
  box-shadow:0 2px 0 #3E9C74;
}
.room-card.pulse{animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,138,61,.6);transform:translateY(-3px) scale(1.02);}
  50%{box-shadow:0 0 0 12px rgba(255,138,61,0);transform:translateY(-3px) scale(1.05);}
}
.ground{
  position:relative;height:78px;margin-top:-2px;border-radius:0 0 22px 22px;
  background:linear-gradient(180deg,#8FD9A0 0%, #6FCB8A 100%);
  box-shadow:0 10px 20px rgba(90,160,110,.25);overflow:hidden;
}
.ground::after{
  content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:120px;height:100%;background:linear-gradient(180deg,#EBD9B8,#DFC79F);
  clip-path:polygon(38% 0,62% 0,100% 100%,0% 100%);
}
.door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:76px;z-index:4;}
.door svg{width:100%;height:auto;display:block;}
#hunter{
  position:absolute;left:0;top:0;width:66px;z-index:6;pointer-events:none;
  transition:transform .62s cubic-bezier(.4,.1,.3,1);
}
#hunter svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));}
#hunter.walking svg{animation:hop .32s ease-in-out infinite;}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
.bubble{
  position:absolute;z-index:7;left:0;top:0;max-width:230px;
  background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 13px;
  font-size:15px;font-weight:800;box-shadow:0 6px 14px rgba(150,110,80,.18);
  opacity:0;transform:translateY(6px) scale(.9);transition:all .25s;pointer-events:none;
}
.bubble.show{opacity:1;transform:none;}
.bubble::after{
  content:"";position:absolute;left:26px;bottom:-11px;width:0;height:0;
  border:8px solid transparent;border-top-color:var(--line);
}

/* ---------- 房间内景 ---------- */
.room-stage{
  position:relative;width:min(720px,92vw,86vh);margin:0 auto;
  aspect-ratio:5/4;border-radius:26px;overflow:hidden;
  box-shadow:0 14px 30px rgba(150,110,80,.22);border:6px solid #fff;
}
.wall{position:absolute;left:0;right:0;top:0;height:74%;}
.floor{position:absolute;left:0;right:0;bottom:0;height:26%;}
.floor::before{
  content:"";position:absolute;left:0;right:0;top:0;height:7px;background:rgba(0,0,0,.07);
}
.floor::after{
  content:"";position:absolute;inset:10px 0 0 0;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 46px);
}
.win{position:absolute;top:3.5%;width:9.5%;pointer-events:none;opacity:.95;}
.win.l{left:5.5%;}
.win.r{right:5.5%;}
.win svg{width:100%;height:auto;display:block;}
.spots{
  position:absolute;left:0;right:0;top:27%;bottom:4%;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  padding:0 3.5%;
}
.spot{
  position:relative;display:flex;align-items:flex-end;justify-content:center;
  padding:1% 3%;min-height:0;
}
.numboo{
  position:absolute;bottom:16%;left:50%;margin-left:-32px;
  width:64px;height:64px;z-index:1;
  border-radius:50%;background:var(--yellow);
  border:4px solid #fff;box-shadow:0 5px 0 #E8B23F, 0 8px 16px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
  transform:scale(.15) rotate(-25deg);opacity:0;
  transition:transform .42s cubic-bezier(.34,1.7,.5,1), opacity .22s;
}
.numboo .digit{font-size:32px;font-weight:900;color:#8A5A00;line-height:1;}
.numboo .eye{
  position:absolute;top:13px;width:7px;height:8px;border-radius:50%;background:#8A5A00;
}
.numboo .eye.l{left:19px;}
.numboo .eye.r{right:19px;}
.numboo .mouth{
  position:absolute;bottom:12px;left:50%;margin-left:-7px;width:14px;height:7px;
  border-bottom:3px solid #8A5A00;border-radius:0 0 14px 14px;
}
.numboo.done{background:var(--green);box-shadow:0 5px 0 #41A87C,0 8px 16px rgba(0,0,0,.15);}
.numboo.done .digit,.numboo.done .eye{color:#0B5038;background:#0B5038;}
.numboo.done .eye{background:#0B5038;}
.numboo.done .mouth{border-bottom-color:#0B5038;}
.spot.open .numboo{transform:scale(1) rotate(0);opacity:1;z-index:5;transition-delay:.1s;}
.cover{
  background-color: #fff;
  position:relative;z-index:2;height:100px;
  display:flex;align-items:flex-end;justify-content:center;
  transform-origin:50% 92%;cursor:pointer;
  transition:transform .45s cubic-bezier(.34,1.4,.6,1), filter .2s;
  filter:drop-shadow(0 5px 6px rgba(90,60,40,.16));
}
.cover svg{display:block;height:100%;width:auto;max-width:100%;}
.cover:hover{transform:translateY(-6px) rotate(-2deg);}
.spot.open .cover{transform:translate(-17%,3%) rotate(-9deg);}
.spot.open .cover:hover{transform:translate(-17%,0) rotate(-11deg);}
.spot.solved .cover{transform:translate(-17%,3%) rotate(-9deg);opacity:.95;}
.spot.wiggle .cover{animation:wiggle .8s ease-in-out infinite;}
@keyframes wiggle{
  0%,100%{transform:rotate(0) translateY(0)}
  25%{transform:rotate(-7deg) translateY(-4px)}
  75%{transform:rotate(7deg) translateY(-4px)}
}
.sparkle{
  position:absolute;z-index:8;pointer-events:none;font-size:26px;
  animation:floaty 1.4s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.15)}}

/* ---------- 数字托盘 ---------- */
.tray{
  max-width:820px;margin:14px auto 0;background:#fff;border-radius:20px;padding:12px 14px;
  box-shadow:0 8px 18px rgba(180,140,100,.14);border:3px solid #FFF1E2;
}
.tray-in{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
.pill{
  width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:900;background:#FFF3E4;color:#CBB49F;border:2px dashed #EBD9C4;
}
.pill.got{background:var(--teal);color:#fff;border:2px solid #25A899;box-shadow:0 3px 0 #25A899;}
.pill.now{background:var(--yellow);color:#8A5A00;border:2px solid #E8B23F;box-shadow:0 3px 0 #E8B23F;animation:beat 1.1s ease-in-out infinite;}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---------- 弹窗 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(74,59,50,.42);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px;z-index:100;
  animation:fade .22s ease;
}
.modal{
  background:#fff;border-radius:28px;padding:24px 22px;max-width:440px;width:100%;
  text-align:center;box-shadow:0 24px 50px rgba(0,0,0,.28);
  border:6px solid #FFF1E2;animation:pop .38s cubic-bezier(.34,1.6,.5,1);
  max-height:88vh;overflow:auto;
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{margin:6px 0 6px;font-size:27px;font-weight:900;}
.modal p{margin:6px 0;color:var(--ink-soft);font-size:16px;line-height:1.7;}
.bignum{
  font-size:76px;font-weight:900;line-height:1;margin:4px 0 8px;
  color:var(--orange);text-shadow:0 5px 0 #FFD9B8;
}
.fruits{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 6px;}
.fruit{font-size:30px;line-height:1;transition:transform .18s, filter .18s;filter:grayscale(0);}
.fruit.hi{transform:scale(1.45) rotate(-10deg);}
.stars{font-size:44px;letter-spacing:6px;margin:6px 0 2px;}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}

.confetti{position:fixed;left:0;top:0;width:12px;height:18px;z-index:99;pointer-events:none;border-radius:3px;}

.tip{
  max-width:820px;margin:10px auto 0;text-align:center;color:var(--ink-soft);font-size:14px;
}
@media (max-width:520px){
  .house-body{grid-template-columns:repeat(2,1fr);}
  .room-card{min-height:100px;}
  .numboo{width:52px;height:52px;margin-left:-26px;}
  .numboo .digit{font-size:26px;}
  .numboo .eye.l{left:14px;} .numboo .eye.r{right:14px;}
  .numboo .eye{top:10px;width:6px;height:7px;}
  .pill{width:36px;height:36px;font-size:16px;}
  #hunter{width:54px;}
}
</style>
</head>
<body>

<!-- ============ 首页 ============ -->
<section id="s-home" class="screen active">
  <div class="home-wrap">
    <h1 class="title"><span class="n">数</span><span class="n">字</span><span class="n">躲</span>哪儿了</h1>
    <p class="subtitle">小猎人出发啦！房间里藏着好多数字，把它们一个一个找出来～</p>

    <div class="hero" id="heroArt"></div>

    <div class="panel">
      <h3>🎯 选个玩法</h3>
      <div class="opts" id="modeOpts">
        <button class="opt on" data-mode="mission">
          <span class="big">🔍 任务模式</span>
          <span class="small">猎人说什么，就找哪个数字</span>
        </button>
        <button class="opt" data-mode="order">
          <span class="big">🔢 顺序模式</span>
          <span class="small">从 1 开始，按顺序找</span>
        </button>
      </div>
    </div>

    <div class="panel">
      <h3>🎚️ 选个难度</h3>
      <div class="opts" id="diffOpts">
        <button class="opt on" data-diff="easy">
          <span class="big">1 - 5</span>
          <span class="small">小试身手</span>
        </button>
        <button class="opt" data-diff="medium">
          <span class="big">1 - 10</span>
          <span class="small">越来越厉害</span>
        </button>
        <button class="opt" data-diff="hard">
          <span class="big">1 - 20</span>
          <span class="small">数字小达人</span>
        </button>
      </div>
    </div>

    <button class="btn" id="startBtn" style="font-size:24px;padding:16px 44px;">🏹 开始寻找！</button>

    <div class="panel" style="margin-top:20px;">
      <h3>📖 怎么玩</h3>
      <div class="howto">
        1. 在<b>大房子</b>上点一个房间，小猎人就会跑过去。<br>
        2. 房间里点<b>家具</b>，家具会让开，看看后面躲着什么。<br>
        3. 找到猎人要的数字，它就被<b>收进背囊</b>啦！<br>
        4. 卡住了？点右上角 <b>💡 提示</b>，猎人会小声告诉你。<br>
        5. 每找到一个数字，还能<b>一起数一数</b>🍎。
      </div>
    </div>
  </div>
</section>

<!-- ============ 房子 ============ -->
<section id="s-house" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="backHome1" title="回到首页">🏠</button>
    <span class="chip mission" id="missionChip">…</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="hintBtn1" title="提示">💡</button>
    <button class="iconbtn" id="soundBtn1" title="声音">🔊</button>
  </div>
  <div class="house-wrap" id="houseWrap">
    <div class="house" id="house">
      <div class="roof" id="roofArt"></div>
      <div class="house-body" id="houseBody"></div>
      <div class="ground">
        <div class="door" id="doorArt"></div>
      </div>
    </div>
    <div id="hunter"></div>
    <div class="bubble" id="bubble"></div>
  </div>
  <p class="tip">点一个房间，小猎人就跑进去找数字啦 👆</p>
</section>

<!-- ============ 房间 ============ -->
<section id="s-room" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="backHouse" title="回到房子">🏠</button>
    <span class="chip mission" id="missionChip2">…</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="hintBtn2" title="提示">💡</button>
    <button class="iconbtn" id="soundBtn2" title="声音">🔊</button>
  </div>
  <div class="room-stage" id="roomStage"></div>
  <div class="tray"><div class="tray-in" id="tray"></div></div>
  <p class="tip" id="roomTip">点家具，看看数字躲在哪里 👀</p>
</section>

<div id="modalRoot"></div>

<script>
/* =========================================================
   美术资源（全部内联 SVG）
   ========================================================= */
const SVG = {
hunter:`<svg viewBox="0 0 100 132">
<ellipse cx="50" cy="128" rx="28" ry="5" fill="rgba(0,0,0,.12)"/>
<rect x="33" y="94" width="13" height="28" rx="6.5" fill="#455A64"/>
<rect x="54" y="94" width="13" height="28" rx="6.5" fill="#455A64"/>
<ellipse cx="37" cy="121" rx="11" ry="6.5" fill="#37474F"/>
<ellipse cx="62" cy="121" rx="11" ry="6.5" fill="#37474F"/>
<path d="M31 50h38a9 9 0 0 1 9 9v34a11 11 0 0 1-11 11H33a11 11 0 0 1-11-11V59a9 9 0 0 1 9-9z" fill="#4EA8DE"/>

const ROOMS = [
  { id:'living',  name:'客厅',   wall:'#FFF1DC', wall2:'#FFE7C4', floor:'#F3D6B0',
    spots:[{n:'沙发',a:'sofa'},{n:'电视',a:'tv'},{n:'书柜',a:'bookshelf'},{n:'地毯',a:'rug'}] },
  { id:'kitchen', name:'厨房',   wall:'#E7F6E9', wall2:'#D6EFDA', floor:'#DCCFB4',
    spots:[{n:'冰箱',a:'fridge'},{n:'烤箱',a:'oven'},{n:'锅',a:'pot'},{n:'果盘',a:'fruitbowl'}] },
  { id:'bedroom', name:'卧室',   wall:'#FDE8F0', wall2:'#FBD8E7', floor:'#F0D2BC',
    spots:[{n:'床',a:'bed'},{n:'衣柜',a:'wardrobe'},{n:'玩具箱',a:'toybox'},{n:'床头柜',a:'nightstand'}] },
  { id:'bath',    name:'浴室',   wall:'#E1F4FB', wall2:'#CFEBF7', floor:'#D9E6EC',
    spots:[{n:'浴缸',a:'bathtub'},{n:'毛巾',a:'towel'},{n:'洗衣机',a:'washer'},{n:'镜子',a:'mirror'}] },
  { id:'study',   name:'书房',   wall:'#F0E9FB', wall2:'#E4D9F7', floor:'#E4D2B8',
    spots:[{n:'书桌',a:'desk'},{n:'台灯',a:'lamp'},{n:'地球仪',a:'globe'},{n:'积木',a:'blocks'}] },
  { id:'play',    name:'游戏室', wall:'#FFF6D9', wall2:'#FFEDB8', floor:'#D8E9C4',
    spots:[{n:'帐篷',a:'tent'},{n:'气球',a:'balloons'},{n:'玩具熊',a:'teddy'},{n:'滑梯',a:'slide'}] }
];

/* =========================================================
   状态
   ========================================================= */
const DIFF = { easy:{max:5,label:'1-5'}, medium:{max:10,label:'1-10'}, hard:{max:20,label:'1-20'} };
const state = {
  mode:'mission', diff:'easy', max:5,
  placement:{},        // "ri-si" -> number
  targets:[],          // mission 模式：出题顺序
  found:new Set(),
  solved:new Set(),    // 已收进背囊的 "ri-si"
  hints:3, hintsUsed:0,
  room:null,
  sound:true,
  busy:false
};
let hintTimer=null, countTimer=null;

const $ = id => document.getElementById(id);
const CN = ['零','一','二','三','四','五','六','七','八','九','十'];
function cn(n){ return n<=10 ? CN[n] : (n<20 ? '十'+CN[n-10] : (n===20?'二十':String(n))); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function key(r,s){ return r+'-'+s; }

/* =========================================================
   声音
   ========================================================= */
let AC=null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended'){ AC.resume(); }
  return AC;
}
function tone(freq,dur,type,delay,gain){
  if(!state.sound) return;
  const c=ac(); if(!c) return;
  const t0=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(gain||0.11,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
const sfx = {
  tap(){ tone(680,0.09,'triangle',0,0.09); },
  open(){ tone(520,0.1,'triangle',0,0.09); tone(760,0.12,'triangle',0.07,0.08); },
  step(){ tone(880,0.05,'square',0,0.045); },
  good(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.2,'sine',i*0.085,0.12)); },
  bad(){ tone(210,0.16,'sawtooth',0,0.06); tone(160,0.2,'sawtooth',0.13,0.06); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.28,'sine',i*0.11,0.13)); },
  hint(){ tone(990,0.1,'sine',0,0.07); tone(1320,0.14,'sine',0.09,0.07); }
};
function say(text){
  if(!state.sound) return;
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=0.88; u.pitch=1.15;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function stopSay(){ try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){} }

/* =========================================================
   屏幕切换
   ========================================================= */
function show(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('s-'+name).classList.add('active');
}

/* =========================================================
   初始化静态美术
   ========================================================= */
function initArt(){
  $('heroArt').innerHTML = SVG.heroArt;
  $('roofArt').innerHTML = SVG.roof;
  $('doorArt').innerHTML = SVG.door;
  $('hunter').innerHTML  = SVG.hunter;
}

/* =========================================================
   开局
   ========================================================= */
function startGame(){
  state.max = DIFF[state.diff].max;
  state.placement = {};
  state.found = new Set();
  state.solved = new Set();
  state.hints = 3; state.hintsUsed = 0;
  state.room = null;
  state.busy = false;

  // 收集所有躲藏点，随机挑 max 个藏数字
  const all=[];
  ROOMS.forEach((r,ri)=>r.spots.forEach((s,si)=>all.push([ri,si])));
  const picked = shuffle(all).slice(0, state.max);
  const nums = shuffle(Array.from({length:state.max},(_,i)=>i+1));
  picked.forEach((p,i)=>{ state.placement[key(p[0],p[1])] = nums[i]; });

  state.targets = state.mode==='order'
    ? Array.from({length:state.max},(_,i)=>i+1)
    : shuffle(Array.from({length:state.max},(_,i)=>i+1));

  renderHouse();
  show('house');
  setTimeout(()=>{
    const t = currentTarget();
    if(t!=null) say('我们要找的数字是'+cn(t)+'。点一个房间，出发吧！');
  },350);
}

function currentTarget(){
  if(state.mode==='order'){
    for(let i=1;i<=state.max;i++){ if(!state.found.has(i)) return i; }
    return null;
  }
  return state.targets[state.found.size] ?? null;
}

function roomHas(ri){
  return ROOMS[ri].spots.some((_,si)=>state.placement[key(ri,si)]!=null);
}
function foundInRoom(ri){
  let c=0;
  ROOMS[ri].spots.forEach((_,si)=>{ const k=key(ri,si); if(state.solved.has(k)) c++; });
  return c;
}
function spotOfNumber(n){
  for(const k in state.placement){ if(state.placement[k]===n) return k; }
  return null;
}

/* =========================================================
   房子视图
   ========================================================= */
function renderHouse(stayRi){
  const body=$('houseBody');
  body.innerHTML='';
  ROOMS.forEach((room,ri)=>{
    const card=document.createElement('div');
    card.className='room-card';
    card.style.setProperty('--rc', room.wall);
    card.dataset.ri=ri;
    const mini=room.spots.map(s=>`<span>${SVG[s.a]}</span>`).join('');
    const f=foundInRoom(ri);
    card.innerHTML=`<div class="mini">${mini}</div><div class="rname">${room.name}</div>${f?`<div class="badge">${f}</div>`:''}`;
    card.addEventListener('click',()=>enterRoom(ri,card));
    body.appendChild(card);
  });
  updateTop();
  requestAnimationFrame(()=>{
    const target = (stayRi!=null && body.children[stayRi]) ? body.children[stayRi] : $('doorArt');
    placeHunter(target,true);
  });
}

function placeHunter(el,instant){
  const wrap=$('houseWrap'), h=$('hunter');
  const wrapRect=wrap.getBoundingClientRect(), r=el.getBoundingClientRect();
  const x = r.left-wrapRect.left + r.width/2 - h.offsetWidth/2;
  const y = r.top -wrapRect.top  + r.height   - h.offsetHeight + 8;
  if(instant){ h.style.transition='none'; }
  h.style.transform=`translate(${x}px,${y}px)`;
  if(instant){ requestAnimationFrame(()=>{ h.style.transition=''; }); }
}

function bubble(text,ms){
  const b=$('bubble'), h=$('hunter');
  b.textContent=text;
  b.classList.add('show');
  const hx=parseFloat((h.style.transform.match(/translate\(([-\d.]+)px/)||[0,0])[1])||0;
  const hy=parseFloat((h.style.transform.match(/translate\([-\d.]+px,\s*([-\d.]+)px/)||[0,0])[1])||0;
  b.style.left=(hx+h.offsetWidth-6)+'px';
  b.style.top =Math.max(0,hy-16)+'px';
  clearTimeout(bubble._t);
  bubble._t=setTimeout(()=>b.classList.remove('show'), ms||2600);
}

function enterRoom(ri,card){
  if(state.busy) return;
  state.busy=true;
  const h=$('hunter');
  h.classList.add('walking');
  placeHunter(card,false);
  let n=0; const steps=setInterval(()=>{ if(n++<4) sfx.step(); else clearInterval(steps); },150);
  say('去'+ROOMS[ri].name+'看看！');
  setTimeout(()=>{
    h.classList.remove('walking');
    state.room=ri;
    renderRoom(ri);
    show('room');
    state.busy=false;
  },640);
}

/* =========================================================
   房间视图
   ========================================================= */
function renderRoom(ri){
  const room=ROOMS[ri], stage=$('roomStage');
  stage.innerHTML='';
  stage.style.background=room.wall2;

  const wall=document.createElement('div');
  wall.className='wall';
  wall.style.background=`linear-gradient(180deg,${room.wall} 0%, ${room.wall2} 100%)`;
  stage.appendChild(wall);

  const fl=document.createElement('div');
  fl.className='floor'; fl.style.background=room.floor;
  stage.appendChild(fl);

  ['l','r'].forEach(side=>{
    const w=document.createElement('div');
    w.className='win '+side; w.innerHTML=SVG.window;
    stage.appendChild(w);
  });

  const spots=document.createElement('div');
  spots.className='spots';
  room.spots.forEach((sp,si)=>{
    const cell=document.createElement('div');
    cell.className='spot';
    const k=key(ri,si);
    const num=state.placement[k];
    if(state.solved.has(k)) cell.classList.add('solved','open');

    const boo=document.createElement('div');
    boo.className='numboo'+(state.solved.has(k)?' done':'');
    boo.innerHTML=`<span class="eye l"></span><span class="eye r"></span><span class="digit">${num!=null?num:'?'}</span><span class="mouth"></span>`;

    const cov=document.createElement('div');
    cov.className='cover';
    cov.innerHTML=SVG[sp.a];
    cov.title=sp.n;

    if(!state.solved.has(k)){
      cov.addEventListener('click',()=>onSpot(ri,si,cell,cov));
    }
    cell.appendChild(boo); cell.appendChild(cov);
    spots.appendChild(cell);
  });
  stage.appendChild(spots);

  updateTop();
  startPassiveHint();
}

function onSpot(ri,si,cell,cov){
  if(state.busy) return;
  const k=key(ri,si);
  const num=state.placement[k];
  const t=currentTarget();

  cell.classList.add('open');
  sfx.open();
  clearTimeout(hintTimer);
  stopSay();

  if(num!=null && num===t){
    // 找到了
    state.busy=true;
    state.found.add(num);
    state.solved.add(k);
    setTimeout(()=>{ cell.classList.add('solved'); onFound(num,ri,si); },420);
  }else{
    // 不是这个
    sfx.bad();
    if(num==null){
      say('哎呀，这里空空的，什么都没有。');
    }else if(state.found.has(num)){
      say('这个是'+cn(num)+'，已经收进背囊啦。我们要找的是'+cn(t)+'。');
    }else{
      say('这是'+cn(num)+'。我们要找的是'+cn(t)+'，数字'+cn(num)+'又躲回去了！');
    }
    setTimeout(()=>{ cell.classList.remove('open'); },1500);
    updateTop();
  }
}

function onFound(num,ri,si){
  sfx.good();
  confetti();
  updateTop();
  const last = state.found.size>=state.max;
  showFoundModal(num,last);
  say('太棒啦！找到'+cn(num)+'！');
}

function nextRound(){
  state.busy=false;
  const t=currentTarget();
  if(t==null){ finish(); return; }
  updateTop();
  say('下一个，找'+cn(t)+'！');
  // 回到房子，再去找下一个数字
  show('house');
  renderHouse(state.room);
  setTimeout(()=>{
    bubble('下一个要找 '+t+' 哦！',2800);
  },300);
}

/* =========================================================
   托盘 / 顶栏
   ========================================================= */
function updateTop(){
  const t=currentTarget();
  const done=state.found.size;
  const html = t==null
    ? `🎉 全部找到啦！`
    : `🔍 找数字 <span class="tgt">${t}</span>　<span style="font-weight:700;color:var(--ink-soft)">${done}/${state.max}</span>`;
  $('missionChip').innerHTML=html;
  $('missionChip2').innerHTML=html;

  const tray=$('tray'); tray.innerHTML='';
  for(let i=1;i<=state.max;i++){
    const p=document.createElement('div');
    p.className='pill'+(state.found.has(i)?' got':'')+(i===t?' now':'');
    p.textContent=i;
    tray.appendChild(p);
  }
  ['hintBtn1','hintBtn2'].forEach(id=>{
    const b=$(id);
    b.textContent='💡';
    b.style.opacity = state.hints>0?1:.4;
  });
  ['soundBtn1','soundBtn2'].forEach(id=>{
    const b=$(id);
    b.textContent = state.sound?'🔊':'🔇';
    b.classList.toggle('off',!state.sound);
  });
  // 房子徽章
  const cards=$('houseBody').querySelectorAll('.room-card');
  cards.forEach((c,ri)=>{
    const f=foundInRoom(ri);
    let b=c.querySelector('.badge');
    if(f){ if(!b){ b=document.createElement('div'); b.className='badge'; c.appendChild(b);} b.textContent=f; }
    else if(b){ b.remove(); }
  });
}

/* =========================================================
   提示
   ========================================================= */
function useHint(){
  const t=currentTarget();
  if(t==null) return;
  if(state.hints<=0){ say('提示用完啦，小猎人相信你可以的！'); return; }
  state.hints--; state.hintsUsed++;
  sfx.hint();
  const k=spotOfNumber(t);
  const [ri,si]=k.split('-').map(Number);
  const roomName=ROOMS[ri].name;

  if(state.room===ri){
    const cells=$('roomStage').querySelectorAll('.spot');
    const cell=cells[si];
    cell.classList.add('wiggle');
    const sp=document.createElement('div');
    sp.className='sparkle'; sp.textContent='✨';
    sp.style.left='50%'; sp.style.top='8%';
    cell.appendChild(sp);
    setTimeout(()=>{ cell.classList.remove('wiggle'); sp.remove(); },3600);
    say('数字'+cn(t)+'就躲在'+roomName+'的这个'+ROOMS[ri].spots[si].n+'后面！');
  }else{
    if($('s-room').classList.contains('active')){
      show('house'); renderHouse(ri);
    }
    setTimeout(()=>{
      const cards=$('houseBody').querySelectorAll('.room-card');
      cards.forEach(c=>c.classList.remove('pulse'));
      cards[ri].classList.add('pulse');
      bubble('数字 '+t+' 躲在'+roomName+'！',3200);
      placeHunter(cards[ri],false);
      setTimeout(()=>cards[ri].classList.remove('pulse'),3600);
    },260);
    say('数字'+cn(t)+'躲在'+roomName+'里，快去！');
  }
  updateTop();
}

function startPassiveHint(){
  clearTimeout(hintTimer);
  const ri=state.room, t=currentTarget();
  if(ri==null||t==null) return;
  const k=spotOfNumber(t);
  if(!k) return;
  const [r,si]=k.split('-').map(Number);
  if(r!==ri) return;
  hintTimer=setTimeout(()=>{
    const cells=$('roomStage').querySelectorAll('.spot');
    if(cells[si] && !cells[si].classList.contains('solved')){
      cells[si].classList.add('wiggle');
      const sp=document.createElement('div');
      sp.className='sparkle'; sp.textContent='👀';
      sp.style.left='50%'; sp.style.top='6%';
      cells[si].appendChild(sp);
      setTimeout(()=>{ cells[si].classList.remove('wiggle'); sp.remove(); },3000);
    }
  },12000);
}

/* =========================================================
   弹窗
   ========================================================= */
function closeModal(){ $('modalRoot').innerHTML=''; stopSay(); }

function showFoundModal(n,last){
  const fruits=Array.from({length:n},()=>['🍎','🍊','🍇','🍓','🍌','🍉'][Math.floor(Math.random()*6)]).join('');
  $('modalRoot').innerHTML=`
    <div class="mask" id="mask">
      <div class="modal">
        <div style="font-size:15px;font-weight:800;color:var(--green)">🎉 找到啦！</div>
        <div class="bignum">${n}</div>
        <p>读作 <b style="color:var(--ink);font-size:20px">${cn(n)}</b>　·　已经收集 <b style="color:var(--ink)">${state.found.size}/${state.max}</b></p>
        <div class="fruits" id="fruits">${Array.from({length:n},(_,i)=>`<span class="fruit" data-i="${i}">${fruits[i]}</span>`).join('')}</div>
        <p style="font-size:14px">这里有 ${n} 个水果，一起来数一数吧！</p>
        <div class="row">
          <button class="btn blue sm" id="countBtn">🔢 数一数</button>
          <button class="btn green" id="nextBtn">${last?'🏆 完成！':'继续寻找 →'}</button>
        </div>
      </div>
    </div>`;
  $('countBtn').addEventListener('click',()=>countAloud(n));
  $('nextBtn').addEventListener('click',()=>{ closeModal(); if(last) finish(); else nextRound(); });
}

function countAloud(n){
  stopSay();
  const items=document.querySelectorAll('#fruits .fruit');
  items.forEach(i=>i.classList.remove('hi'));
  let i=0;
  clearInterval(countTimer);
  countTimer=setInterval(()=>{
    if(i>=n){ clearInterval(countTimer); say('一共'+cn(n)+'个！'); return; }
    items.forEach(x=>x.classList.remove('hi'));
    items[i].classList.add('hi');
    tone(523*Math.pow(1.06,i),0.12,'sine',0,0.09);
    say(cn(i+1));
    i++;
  },560);
}

function finish(){
  sfx.win();
  confetti(90);
  const stars = state.hintsUsed===0 ? 3 : (state.hintsUsed<=1 ? 2 : 1);
  $('modalRoot').innerHTML=`
    <div class="mask" id="mask">
      <div class="modal">
        <div style="font-size:52px">🏆</div>
        <h2>全部找到啦！</h2>
        <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
        <p>小猎人把 <b style="color:var(--ink)">${state.max}</b> 个数字全都找出来了！</p>
        <p style="font-size:14px">难度：数字 ${DIFF[state.diff].label}　·　用了提示 ${state.hintsUsed} 次</p>
        <div class="row">
          <button class="btn green" id="againBtn">🔄 再玩一次</button>
          <button class="btn ghost" id="homeBtn">🏠 回到首页</button>
        </div>
      </div>
    </div>`;
  say('哇！全部找到啦，你真是数字小达人！');
  $('againBtn').addEventListener('click',()=>{ closeModal(); startGame(); });
  $('homeBtn').addEventListener('click',()=>{ closeModal(); show('home'); });
}

function confetti(count){
  const n=count||46;
  const colors=['#FF8A3D','#FF6B9D','#2EC4B6','#4EA8DE','#A78BFA','#FFD166','#57CC99'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=colors[i%colors.length];
    c.style.left=Math.random()*100+'vw';
    c.style.top=(-8-Math.random()*20)+'vh';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    c.style.width=(8+Math.random()*8)+'px';
    c.style.height=(12+Math.random()*10)+'px';
    document.body.appendChild(c);
    const dur=1800+Math.random()*1600, delay=Math.random()*400;
    c.animate([
      {transform:`translate(0,0) rotate(0deg)`,opacity:1},
      {transform:`translate(${(Math.random()*160-80)}px, 108vh) rotate(${Math.random()*900-450}deg)`,opacity:.9}
    ],{duration:dur,delay:delay,easing:'cubic-bezier(.25,.6,.5,1)'}).onfinish=()=>c.remove();
  }
}

/* =========================================================
   事件绑定
   ========================================================= */
function bind(){
  $('modeOpts').addEventListener('click',e=>{
    const b=e.target.closest('.opt'); if(!b) return;
    $('modeOpts').querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));
    b.classList.add('on'); state.mode=b.dataset.mode; sfx.tap();
  });
  $('diffOpts').addEventListener('click',e=>{
    const b=e.target.closest('.opt'); if(!b) return;
    $('diffOpts').querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));
    b.classList.add('on'); state.diff=b.dataset.diff; sfx.tap();
  });
  $('startBtn').addEventListener('click',()=>{ ac(); sfx.tap(); startGame(); });

  $('backHome1').addEventListener('click',()=>{ stopSay(); clearTimeout(hintTimer); show('home'); });
  $('backHouse').addEventListener('click',()=>{
    stopSay(); clearTimeout(hintTimer);
    const ri=state.room;
    state.room=null; state.busy=false;
    show('house'); renderHouse(ri);
  });
  $('hintBtn1').addEventListener('click',useHint);
  $('hintBtn2').addEventListener('click',useHint);
  const toggleSound=()=>{
    state.sound=!state.sound;
    if(!state.sound) stopSay(); else sfx.tap();
    updateTop();
  };
  $('soundBtn1').addEventListener('click',toggleSound);
  $('soundBtn2').addEventListener('click',toggleSound);

  window.addEventListener('resize',()=>{
    if($('s-house').classList.contains('active')){
      const el = state.room!=null ? $('houseBody').children[state.room] : $('doorArt');
      if(el) placeHunter(el,true);
    }
  });
}

initArt();
bind();
updateTop();
</script>
